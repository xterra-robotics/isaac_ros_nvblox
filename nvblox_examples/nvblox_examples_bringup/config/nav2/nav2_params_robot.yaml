controller_server:
  ros__parameters:
    use_sim_time: False  # Changed to False for real hardware
    controller_frequency: 20.0  # Increased for more responsive control
    min_x_velocity_threshold: 0.05  # Increased for legged robot
    min_y_velocity_threshold: 0.05  # Increased and enabled for omnidirectional movement
    min_theta_velocity_threshold: 0.1  # Increased for legged robot
    failure_tolerance: 0.2  # Decreased for stricter path following
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3  # Decreased for tighter progress checking
      movement_time_allowance: 10.0

    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2  # Slightly decreased for more precise positioning
      yaw_goal_tolerance: 0.2  # Slightly decreased for more precise orientation

    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: -0.3  # Allow reverse motion
      min_vel_y: -0.3  # Allow lateral motion
      max_vel_x: 0.5   # Adjusted for legged robot
      max_vel_y: 0.5   # Adjusted for legged robot
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.5  # Adjusted for legged robot
      min_speed_theta: 0.0
      acc_lim_x: 1.0  # Reduced for smoother acceleration
      acc_lim_y: 1.0  # Added for omnidirectional movement
      acc_lim_theta: 2.0  # Reduced for smoother rotation
      decel_lim_x: -1.0  # Reduced for smoother deceleration
      decel_lim_y: -1.0  # Added for omnidirectional movement
      decel_lim_theta: -2.0  # Reduced for smoother rotation
      vx_samples: 20
      vy_samples: 20  # Increased for better lateral motion planning
      vtheta_samples: 40  # Increased for better rotational planning
      sim_time: 2.0  # Increased for longer trajectory prediction
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5 #0.2
      xy_goal_tolerance: 0.2  # Matches the general_goal_checker
      trans_stopped_velocity: 0.1  # Reduced for more precise stop detection
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      transform_tolerance: 0.5 # Added: Match global settings
      width: 3  # Increased: Provide larger local window
      height: 3 # Increased: Provide larger local window
      origin_x: -1.5 # Added: Center local costmap
      origin_y: -1.5 # Added: Center local costmap
      resolution: 0.05
      robot_radius: 0.2  # Adjust based on your robot's size
      static_map: False # newly added
      plugins: ["nvblox_layer","voxel_layer","inflation_layer"]
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        nav2_costmap_global_frame: odom # must match with global_frame of local_costmap
        nvblox_map_slice_topic: "/nvblox_node/static_map_slice"
        convert_to_binary_costmap: True
        transform_tolerance: 0.5
        wait_for_transform: true  # Add this
        transform_buffer_length: 15.0  # Add this
        update_interval: 0.1  # Add this
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: -0.2
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: pointcloud
        pointcloud:
          topic: /nvblox_node/esdf_pointcloud
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.6

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      robot_radius: 0.2  # Adjust based on your robot's size
      resolution: 0.05
      width: 20  # Added: Fix "out of bounds" error
      height: 20 # Added: Fix "out of bounds" error
      origin_x: -10.0 # Added: Center costmap
      origin_y: -10.0 # Added: Center costmap
      transform_tolerance: 0.5 # Added: Handle transform timing issues
      track_unknown_space: true
      transform_latency_threshold: 0.5  # Add this
      plugins: ["inflation_layer","nvblox_layer","obstacle_layer"]
    #   "static_map_layer",
    #   static_map_layer:
    #     plugin: "nav2_costmap_2d::StaticLayer"
    #     map_subscribe_transient_local: True
    #     enabled: true
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        nav2_costmap_global_frame: map # must match with global_frame of global_costmap
        nvblox_map_slice_topic: "/nvblox_node/static_map_slice"
        convert_to_binary_costmap: True
        transform_tolerance: 0.5 # Added: Match global transform tolerance
        wait_for_transform: true
        transform_buffer_length: 30.0  # Increased
        use_latest_available_transform: true
        transform_check_interval: 0.05  # Add this
        extrapolate_transforms: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: pointcloud
        pointcloud:
          topic: /nvblox_node/esdf_pointcloud
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.8
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true


map_saver:
  ros__parameters:
    use_sim_time: False  # Changed to False for real hardware
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0  # Reduced for potential lower computational capacity
    use_sim_time: False  # Changed to False for real hardware
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true  # Changed to true for potentially better performance in complex environments
      allow_unknown: false  # Changed to false for safety, to avoid planning through unknown areas

smoother_server:
  ros__parameters:
    use_sim_time: False  # Changed to False for real hardware
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5 #0.1
    use_sim_time: false  # Changed to false for real hardware
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5  # Reduced for safety
    min_rotational_vel: 0.1  # Reduced for more precise control
    rotational_acc_lim: 1.5  # Reduced for smoother acceleration

robot_state_publisher:
  ros__parameters:
    use_sim_time: False  # Changed to False for real hardware

waypoint_follower:
  ros__parameters:
    use_sim_time: False  # Changed to False for real hardware
    loop_rate: 20
    stop_on_failure: true  # Changed to true for safety
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False  # Changed to False for real hardware
    smoothing_frequency: 20.0
    scale_velocities: True  # Changed to True for better control
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.5, 0.5]  # Adjusted for legged robot, allowing omnidirectional movement
    min_velocity: [-0.5, -0.5, -0.5]  # Adjusted for legged robot, allowing omnidirectional movement
    max_accel: [0.5, 0.5, 1.0]  # Reduced for smoother acceleration
    max_decel: [-0.5, -0.5, -1.0]  # Reduced for smoother deceleration
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0